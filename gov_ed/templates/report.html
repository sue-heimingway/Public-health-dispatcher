<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>诉求进度 · GovOS</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  html, body { background: #f6f8fb; }
  .rp { max-width: 520px; margin: 0 auto; padding: 0 0 28px; min-height: 100vh; }
  .rp-top {
    background: linear-gradient(160deg, #1d4ed8, #1e3a8a); color: #fff;
    padding: 18px 18px 26px; border-radius: 0 0 22px 22px;
    box-shadow: 0 18px 40px -22px rgba(30, 58, 138, .8);
  }
  .rp-top .r1 { display: flex; align-items: center; gap: 8px; font-size: 12px; opacity: .85; }
  .rp-top h1 { margin: 10px 0 2px; font-size: 20px; }
  .rp-top .sub { font-size: 12.5px; opacity: .8; }
  .rp-hero {
    margin: -16px 14px 0; background: #fff; border-radius: 18px;
    box-shadow: 0 12px 30px -18px rgba(15, 23, 42, .5); padding: 18px 16px;
    display: flex; align-items: center; gap: 16px;
  }
  .ring {
    width: 92px; height: 92px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: conic-gradient(var(--c, #2563eb) 0 100%, #e8eef7 100% 100%); position: relative;
  }
  .ring::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #fff; }
  .ring b { position: relative; z-index: 1; font-size: 24px; font-family: var(--mono); line-height: 1; }
  .ring span { position: relative; z-index: 1; font-size: 9.5px; color: var(--ink-3); display: block; }
  .hero-main { flex: 1; min-width: 0; }
  .hero-main .big { font-size: 16px; font-weight: 700; }
  .hero-main .sm { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .rp-sec { margin: 14px; }
  .rp-sec h2 { font-size: 13px; margin: 0 0 9px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
  .rp-sec h2::before { content: ""; width: 3px; height: 13px; background: var(--blue); border-radius: 2px; }
  .act-grid { display: grid; grid-template-columns: 1fr; gap: 9px; }
  .act {
    border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 14px 12px;
    text-align: left; cursor: pointer; box-shadow: 0 6px 16px -14px rgba(15, 23, 42, .5);
    display: flex; align-items: center; gap: 10px;
  }
  .act:active { transform: scale(.99); }
  .act .em { font-size: 18px; }
  .act b { display: block; font-size: 13.5px; }
  .act span { font-size: 11px; color: var(--ink-3); }
  .notice { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; font-size: 12.5px; line-height: 1.75; color: var(--ink-2); white-space: pre-wrap; }
  .reply { margin: 14px; border-radius: 14px; padding: 14px; background: #fff5f4; border: 1px solid var(--red-line); color: #912018; font-size: 13px; line-height: 1.7; display: none; }
  .tips { margin: 12px 14px 0; font-size: 11.5px; color: var(--ink-3); line-height: 1.8; }
</style>
</head>
<body>
<div class="rp" id="app">
  <div class="rp-top">
    <div class="r1"><span>GovOS · 诉求进度</span><span style="margin-left:auto" id="stage-chip">处理中</span></div>
    <h1 id="greet">正在加载…</h1>
    <div class="sub" id="subline">你的诉求已受理</div>
  </div>

  <div class="rp-hero">
    <div class="ring" id="ring" style="--c:#2563eb"><div><b id="lvl">—</b><span>响应等级</span></div></div>
    <div class="hero-main">
      <div class="big" id="waitline">正在研判…</div>
      <div class="sm" id="route">处置通道 —</div>
      <div class="small muted" id="updated" style="margin-top:6px">刚刚更新</div>
    </div>
  </div>

  <div class="rp-sec">
    <h2>情况有变化？</h2>
    <div class="act-grid">
      <button class="act" data-kind="worse"><span class="em">🆘</span><div><b>情况更紧急了</b><span>例如病情加重、事态恶化</span></div></button>
      <button class="act" data-kind="spread"><span class="em">👥</span><div><b>很多人跟帖也说这样</b><span>我们小区/单位不少人同样遭遇</span></div></button>
      <button class="act" data-kind="rumor"><span class="em">📣</span><div><b>有人开始传谣了</b><span>出现不实信息、煽动性言论</span></div></button>
    </div>
    <div class="small muted" style="margin-top:9px;line-height:1.7">
      点一下会<strong>立刻重新评估</strong>，值班人员同时收到提醒，不是普通留言。
    </div>
  </div>

  <div class="reply" id="reply">
    <div class="tag" id="reply-tag">已记录</div>
    <div id="reply-text" style="margin-top:5px"></div>
  </div>

  <div class="rp-sec">
    <h2>给你的答复</h2>
    <div class="notice" id="notice">正在获取…</div>
  </div>

  <div class="tips">
    <b>温馨提示</b>：处置期间请以官方渠道发布的信息为准，不要转发未经核实的内容；
    涉及人身安全请直接拨打 110 / 120 / 119。
  </div>
</div>

<script src="/static/app.js"></script>
<script>
(() => {
  const token = new URLSearchParams(location.search).get("t") || "";
  const KIND_LABEL = { worse: "情况更紧急", spread: "多人跟帖同诉", rumor: "出现传谣" };
  const LVCOLOR = { 1: "#b91c1c", 2: "#ea580c", 3: "#ca8a04", 4: "#2563eb" };
  if (!token) { $("#greet").textContent = "链接无效"; $("#notice").textContent = "请从工作台重新生成上报链接。"; return; }

  function paint(v) {
    $("#greet").textContent = v.name + "，你好";
    $("#subline").textContent = v.taken_over ? "值班人员已接管你的诉求" : "你的诉求已受理，正在按程序办理";
    $("#stage-chip").textContent = v.stage;
    $("#lvl").textContent = v.level + " 级";
    $("#ring").style.setProperty("--c", LVCOLOR[v.level] || "#2563eb");
    $("#waitline").innerHTML = v.level <= 2 ? '已进入<strong style="color:var(--red)">快速响应</strong>通道' : "正在按程序办理中";
    $("#route").textContent = { 1: "转 120/110/119 + 属地", 2: "转 宣传部/网信办/政法", 3: "派发责任部门工单", 4: "自动答复" }[v.level] || "—";
    $("#updated").textContent = "更新于 " + (v.updated_at || "").slice(-8);
    $("#notice").textContent = v.notice || "";
    if (v.taken_over) {
      $("#reply").style.display = "block"; $("#reply").style.background = "#ecfdf3"; $("#reply").style.borderColor = "#abefc6"; $("#reply").style.color = "#067647";
      $("#reply-tag").textContent = "已接管"; $("#reply-text").textContent = "值班人员已经接管你的诉求，会在办理完成后与你联系。";
    }
  }

  async function load() {
    try { paint(await api("/api/report/" + encodeURIComponent(token))); }
    catch (e) { $("#notice").textContent = "获取失败：" + e.message; }
  }

  async function submit(kind) {
    try {
      const r = await api("/api/report", { body: { token, kind, label: KIND_LABEL[kind] || kind, text: KIND_LABEL[kind] } });
      const box = $("#reply");
      box.style.display = "block";
      box.style.background = r.escalated ? "#fff5f4" : "#f8fafc";
      box.style.borderColor = r.escalated ? "#fecdca" : "#e2e8f0";
      box.style.color = r.escalated ? "#912018" : "#41506b";
      $("#reply-tag").textContent = r.escalated ? "已升级 · 优先处置" : "已记录";
      $("#reply-text").textContent = r.message || "";
      if (r.escalated) { beep(1); toast("已升级，值班人员收到提醒", "err"); }
      else toast("已提交", "ok");
      await load();
    } catch (e) { toast("提交失败：" + e.message, "err"); }
  }

  document.addEventListener("click", (ev) => { const a = ev.target.closest(".act"); if (a) submit(a.dataset.kind); });
  load();
  setInterval(load, 8000);
})();
</script>
</body>
</html>
